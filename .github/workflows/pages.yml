name: Deploy to GitHub Pages

on:
  push:
    branches: [main, heightfield]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # main branch -> site root (https://svenpilz.github.io/vibe/)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      # heightfield branch -> subfolder (https://svenpilz.github.io/vibe/vibe-heightfield/)
      - uses: actions/checkout@v4
        with:
          ref: heightfield
          path: heightfield-src

      - name: Install dependencies (heightfield)
        run: npm install
        working-directory: heightfield-src

      - name: Build heightfield site into dist/vibe-heightfield
        run: npm run build -- --outDir ../dist/vibe-heightfield --emptyOutDir
        working-directory: heightfield-src

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # no named environment: the github-pages environment only allows the
    # main branch, but this workflow also deploys the heightfield branch
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
