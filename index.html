<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vibe heightfield — 3D OSM Berlin (S Friedenau)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #0e1116; }
    #scene { width: 100%; height: 100%; display: block; }

    #panel {
      position: fixed; top: 12px; left: 12px;
      background: rgba(16, 18, 24, 0.88); color: #eee;
      border-radius: 10px; padding: 12px 14px;
      backdrop-filter: blur(8px);
      font-size: 13px; line-height: 1.5;
      max-width: 340px;
    }
    #panel h1 { font-size: 15px; margin-bottom: 4px; }
    #panel .sub { color: #9aa4b2; font-size: 12px; margin-bottom: 6px; }
    #stats { color: #7ec8ff; font-size: 12px; }
    #loading { color: #f0c674; font-size: 12px; margin-top: 4px; }

    #help {
      position: fixed; top: 12px; right: 12px;
      background: rgba(16, 18, 24, 0.88); color: #cfd6df;
      border-radius: 10px; padding: 10px 14px;
      font-size: 12px; line-height: 1.6;
      backdrop-filter: blur(8px);
      text-align: right;
    }
    #help b { color: #fff; }

    #minimap {
      position: fixed; bottom: 12px; right: 12px;
      background: rgba(16, 18, 24, 0.85);
      border-radius: 8px; padding: 6px;
      backdrop-filter: blur(8px);
    }
    #minimap canvas { display: block; border-radius: 4px; }
    #minimap .label { color: #9aa4b2; font-size: 10px; text-align: center; margin-top: 2px; }

    #status {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(16, 18, 24, 0.88); color: #cfd6df;
      border-radius: 8px; padding: 6px 14px;
      font-size: 12px; white-space: nowrap;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="panel">
    <h1>vibe heightfield</h1>
    <div class="sub">3D OpenStreetMap · 2 km around S Friedenau, Berlin · OSM + SRTM heights</div>
    <div id="stats"></div>
    <div id="loading"></div>
  </div>
  <div id="help">
    <b>drag</b> orbit · <b>wheel</b> zoom · <b>right-drag</b> pan<br/>
    <b>W A S D</b> / arrows drive · <b>C</b> chase cam · <b>V</b> driver view · <b>R</b> reset car
  </div>
  <div id="status">loading…</div>
  <div id="minimap"><canvas id="minimap-canvas" width="220" height="220"></canvas><div class="label">N ↑ · 2 km around S Friedenau</div></div>
  <script type="module" src="/src3d/main.ts"></script>
</body>
</html>
